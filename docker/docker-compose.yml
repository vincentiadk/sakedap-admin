version: "3"

services:
  webserver:
    build:
      context: ./bin/webserver
    container_name: "7.2.x-webserver"
    restart: "always"
    ports:
      - "${HOST_MACHINE_UNSECURE_HOST_PORT}:80"
      - "${HOST_MACHINE_SECURE_HOST_PORT}:443"
    links:
      - db
      - solrserver
      - oracledb
    volumes:
      - ${DOCUMENT_ROOT-./www}:/var/www/html
      - ${PHP_INI-./config/php/php.ini}:/usr/local/etc/php/php.ini
      - ${VHOSTS_DIR-./config/vhosts}:/etc/apache2/sites-enabled
      - ${PORTS_CONF-./config/apache2/ports.conf}:/etc/apache2/ports.conf
      - ${LOG_DIR-./logs/apache2}:/var/log/apache2
  db:
    image: mysql
    container_name: "db"
    restart: "always"
    ports:
      - "${HOST_MACHINE_MYSQL_PORT}:3306"
    command: --max_allowed_packet=32505856
    volumes:
      - ${MARIADB_DATA_DIR-./data/mysql}:/var/lib/mysql
      - ${MARIADB_LOG_DIR-./logs/mysql}:/var/log/mysql
      - ${MARIADB_CONFIG_DIR-./config/mysql}:/etc/mysql/conf.
    environment:
      - "MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}"
      - "MYSQL_DATABASE=${MYSQL_DATABASE}"
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: "phpmyadmin"
    restart: "always"
    links:
      - db
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      UPLOAD_LIMIT: 1000048K
      MAX_EXECUTION_TIME: 10000
    ports:
      - "8000:80"
    volumes:
      - /sessions
  solrserver:
    image: solr:8.8.0-slim
    container_name: solrserver
    restart: "always"
    ports:
      - "8983:8983"
    volumes:
      - ${SOLR_ROOT-./data/solr}:/var/solr
    user: root
    # run as root to change the permissions of the solr folder
    # Change permissions of the solr folder, create a default core and start solr as solr user
    command: bash -c "chown -R 8983:8983 /var/solr && runuser -u solr -- solr-precreate default-core"
  oracledb:
    image: oracleinanutshell/oracle-xe-11g:latest
    container_name: oracle_server
    restart: "always"
    ports:
      - 1521:1521
      - 5500:5500
